<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brimkern</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1f1f1f;--muted:#4d5156;--line:#dadce0;--surface:#f1f3f4;--accent:#1f1f1f;--accent-fg:#fff;--link:#1a0dab}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1f;--fg:#f0f0eb;--muted:#a3a6ad;--line:#33363f;--surface:#222329;--accent:#ef4444;--accent-fg:#fff;--link:#99c3ff}}
*{box-sizing:border-box}
body{margin:0;padding:16px;min-width:310px;max-width:380px;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,sans-serif}
.hd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:14px}
.opt{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.opt-text{display:flex;flex-direction:column;gap:4px}
.opt-title{font-weight:600;font-size:13.5px;color:var(--fg)}
.opt-desc{font-size:12px;line-height:1.45;color:var(--muted)}
.switch{position:relative;flex:none;width:40px;height:22px;margin-top:2px}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.track{display:block;width:40px;height:22px;border-radius:999px;background:var(--line);transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--bg);transition:transform .15s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::after{transform:translateX(18px);background:var(--accent-fg)}
.switch input:focus-visible+.track{outline:2px solid var(--link);outline-offset:2px}
.saved{margin:10px 0 0;min-height:18px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
  <div class="hd" id="hd"></div>
  <label class="opt">
    <span class="opt-text">
      <span class="opt-title" id="auto-title"></span>
      <span class="opt-desc" id="auto-desc"></span>
    </span>
    <span class="switch">
      <input type="checkbox" id="auto-toggle" role="switch">
      <span class="track" aria-hidden="true"></span>
    </span>
  </label>
  <p class="saved" id="saved" role="status" aria-live="polite"></p>
  <script type="module" src="options.js"></script>
</body>
</html>
