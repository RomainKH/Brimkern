<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brimkern</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1f1f1f;--muted:#4d5156;--line:#dadce0;--surface:#f1f3f4;--accent:#1f1f1f;--accent-fg:#fff;--link:#1a0dab;--danger:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1f;--fg:#f0f0eb;--muted:#a3a6ad;--line:#33363f;--surface:#222329;--accent:#ef4444;--accent-fg:#fff;--link:#99c3ff;--danger:#f87171}}
*{box-sizing:border-box}
body{margin:0;padding:16px;min-width:330px;max-width:400px;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;gap:10px}
.hd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:2px}
.opt{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
label.opt{cursor:pointer}
.opt-col{display:flex;flex-direction:column;gap:8px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.opt-text{display:flex;flex-direction:column;gap:3px}
.opt-title{font-weight:600;font-size:13.5px;color:var(--fg)}
.opt-desc{font-size:12px;line-height:1.45;color:var(--muted)}
.switch{position:relative;flex:none;width:40px;height:22px;margin-top:2px}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.track{display:block;width:40px;height:22px;border-radius:999px;background:var(--line);transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--bg);transition:transform .15s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::after{transform:translateX(18px);background:var(--accent-fg)}
.switch input:focus-visible+.track,select:focus-visible,button:focus-visible{outline:2px solid var(--link);outline-offset:2px}
select{width:100%;font:13px/1.4 system-ui,-apple-system,sans-serif;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
button{font:500 13px/1 system-ui,-apple-system,sans-serif;border-radius:999px;padding:8px 14px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg)}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
button.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
button.block{width:100%;text-align:center}
.saved{margin:0;min-height:18px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
  <div class="hd" id="hd"></div>

  <button type="button" class="block" id="open-panel"></button>

  <label class="opt">
    <span class="opt-text">
      <span class="opt-title" id="auto-title"></span>
      <span class="opt-desc" id="auto-desc"></span>
    </span>
    <span class="switch">
      <input type="checkbox" id="auto-toggle" role="switch">
      <span class="track" aria-hidden="true"></span>
    </span>
  </label>

  <label class="opt">
    <span class="opt-text">
      <span class="opt-title" id="udm-title"></span>
      <span class="opt-desc" id="udm-desc"></span>
    </span>
    <span class="switch">
      <input type="checkbox" id="udm-toggle" role="switch">
      <span class="track" aria-hidden="true"></span>
    </span>
  </label>

  <div class="opt-col">
    <label class="opt-title" for="tier-select" id="tier-title"></label>
    <select id="tier-select"></select>
    <span class="opt-desc" id="tier-desc"></span>
  </div>

  <div class="opt-col">
    <div class="row">
      <span class="opt-title" id="cache-title"></span>
      <button type="button" class="danger" id="clear-cache"></button>
    </div>
    <span class="opt-desc" id="cache-info"></span>
  </div>

  <p class="saved" id="saved" role="status" aria-live="polite"></p>
  <script type="module" src="options.js"></script>
</body>
</html>
