<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Brimkern — local WebGPU inference, real AI models in your browser">
  <!-- Bannière README aux couleurs du DARK THEME de l'app (encre chaude #171614, accent rouge éclairci
       #d9463a, texte papier #ece9e1) — avec la marque « puce qui sourit » (src/app/BrandMark.tsx, 2026-09-23). -->

  <!-- Fond encre + coins arrondis -->
  <rect width="1280" height="300" rx="24" fill="#171614"/>
  <!-- Filet rouge (élément d'identité) -->
  <rect width="1280" height="6" rx="3" fill="#d9463a"/>

  <!-- La marque : la puce qui sourit (cf. src/app/BrandMark.tsx), trait papier, œil-curseur rouge -->
  <g transform="translate(78,70) scale(1.6)" fill="none" stroke="#ece9e1" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-8 50 50)">
      <rect x="24" y="24" width="52" height="52" rx="10"/>
      <path d="M37 24 V15 M50 24 V13 M63 24 V15 M37 76 V85 M50 76 V87 M63 76 V85 M24 37 H15 M24 50 H13 M24 63 H15 M76 37 H85 M76 50 H87 M76 63 H85"/>
      <circle cx="40" cy="45" r="3" fill="#ece9e1" stroke="none"/>
      <rect x="56" y="38.5" width="6.5" height="12" rx="1" fill="#d9463a" stroke="none"/>
      <path d="M40 59 C45 65 55 65 60 59"/>
    </g>
  </g>

  <!-- Wordmark : Brim (papier) + kern (rouge) -->
  <text x="272" y="124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="78" font-weight="800" letter-spacing="-3" fill="#ece9e1">Brim<tspan fill="#d9463a">kern</tspan></text>

  <!-- Tagline -->
  <text x="274" y="172" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="26" font-weight="500" fill="#b5b1a6">Local WebGPU inference — real AI models, right in your browser.</text>

  <!-- Puces mots-clés (contour rouge sur encre) -->
  <g font-family="ui-monospace,'Fira Code',SFMono-Regular,monospace" font-size="19" font-weight="500" fill="#d9463a">
    <g><rect x="274" y="200" width="108" height="38" rx="8" fill="none" stroke="#d9463a" stroke-opacity="0.45"/><text x="328" y="225" text-anchor="middle">WebGPU</text></g>
    <g><rect x="392" y="200" width="82"  height="38" rx="8" fill="none" stroke="#d9463a" stroke-opacity="0.45"/><text x="433" y="225" text-anchor="middle">WGSL</text></g>
    <g><rect x="484" y="200" width="80"  height="38" rx="8" fill="none" stroke="#d9463a" stroke-opacity="0.45"/><text x="524" y="225" text-anchor="middle">.brik</text></g>
    <g><rect x="574" y="200" width="132" height="38" rx="8" fill="none" stroke="#d9463a" stroke-opacity="0.45"/><text x="640" y="225" text-anchor="middle">100% local</text></g>
    <g><rect x="716" y="200" width="66"  height="38" rx="8" fill="none" stroke="#d9463a" stroke-opacity="0.45"/><text x="749" y="225" text-anchor="middle">SDK</text></g>
  </g>
</svg>
