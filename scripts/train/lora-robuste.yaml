# Phase ROBUSTE — à lancer si le pilote du 2026-09-28 ne suffit pas (banc : faits 1/8 contre 5/8).
# Ce qui change par rapport au pilote, et pourquoi :
#   - données vérifiées (verify-dialogues.mjs) : l'entraînement ne voit plus aucune paraphrase de chiffre ;
#   - taux d'apprentissage divisé par deux : au pilote la perte de validation touchait son minimum au
#     pas 700 (0,455) et remontait au pas 800 (0,546) — on apprenait vite, et vite trop ;
#   - évaluation sur 100 exemples (40 au pilote, trop peu : 0,51 puis 0,455 puis 0,546), tous les 100 pas,
#     sauvegarde à chaque évaluation : on
#     choisit l'adaptateur par eval-facts.py, pas par le dernier pas ;
#   - mémoire : batch 4 × 1280 AVEC grad_checkpoint, plafond MLX 10 Go (MLX_MEM_GB=10), Mac libre —
#     le premier essai à batch 4 × 2048 SANS checkpointing, en parallèle de 4 `claude -p`, l'avait fait
#     tomber ; le pilote relancé (batch 2) plafonnait à 5,2 Go. Rien d'autre en parallèle.
# Chemins absolus (mlx-lm ne développe pas « ~ ») ; iters ≈ 2 passes : 2 × exemples / batch_size.
#   MLX_MEM_GB=10 nice -n 15 ~/.cache/brimkern-train/venv/bin/python scripts/train/train-lora.py -c scripts/train/lora-robuste.yaml
# Modèle au vocabulaire TAILLÉ (prune-vocab.py, rembourré à 42 880 — cf. ROADMAP § 22) : le LoRA ne
# touche ni l'embedding ni la tête (clés attn/mlp), les lignes de rembourrage restent nulles.
model: /Users/romainkhanonyan/.cache/brimkern-train/qwen3-0.6b-enfr
train: true
data: /Users/romainkhanonyan/.cache/brimkern-train/sft-robuste
fine_tune_type: lora
mask_prompt: true
num_layers: -1
batch_size: 4
iters: 4000
learning_rate: 5.0e-5
steps_per_report: 50
steps_per_eval: 100
val_batches: 50
save_every: 100
max_seq_length: 1280
grad_checkpoint: true
adapter_path: /Users/romainkhanonyan/.cache/brimkern-train/runs/robuste/adapters
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.1
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj", "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
seed: 0
